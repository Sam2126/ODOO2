services:
  db:
    image: postgres:17-alpine
    container_name: stocksense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense
      POSTGRES_DB: stocksense
    ports:
      - "5433:5432"
    volumes:
      - stocksense-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stocksense-pgdata:
